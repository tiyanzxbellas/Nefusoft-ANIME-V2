      margin-bottom: 24px;

    .nefu-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(246, 207, 128, 0.1);
      border-radius: 50%;
      border-top-color: #F6CF80;
      animation: nefuSpin 1s ease-in-out infinite;

    @keyframes pulseLogo {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.05); opacity: 1; }
    }
    @keyframes nefuSpin {
      to { transform: rotate(360deg); }
    }
